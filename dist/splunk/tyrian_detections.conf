[Tyrian - Known Vulnerable Driver Loaded (BYOVD)]
description = Detects loading of drivers repeatedly abused to get kernel-level code execution from an administrator context. Bring-your-own-vulnerable-driver is the standard way ransomware crews disable endpoint protection: the driver is signed and legitimate, so it loads cleanly, and the vulnerability inside it is used to kill protected processes. Keep this list current against the Microsoft vulnerable driver blocklist and LOLDrivers.
search = index=* source="WinEventLog:Microsoft-Windows-Sysmon/Operational" ((EventID="6") AND (ImageLoaded="*\iqvw64e.sys" OR ImageLoaded="*\RTCore64.sys" OR ImageLoaded="*\gdrv.sys" OR ImageLoaded="*\dbutil_2_3.sys" OR ImageLoaded="*\DBUtilDrv2.sys" OR ImageLoaded="*\procexp152.sys" OR ImageLoaded="*\truesight.sys" OR ImageLoaded="*\viragt64.sys" OR ImageLoaded="*\aswArPot.sys" OR ImageLoaded="*\mhyprot2.sys"))
# severity: critical   techniques: T1068,T1562.001   status: experimental
# validate: Atomic Red Team T1068
#   sc create tyriantest binPath= C:\Windows\Temp\RTCore64.sys type= kernel
#   sc start tyriantest
