title: Remote Desktop Enabled via Registry
id: 0b1db8ec-dfa4-4bf0-85ab-tyrian000070
status: experimental
description: >
  Detects fDenyTSConnections being set to 0, which turns on inbound RDP.
  Intruders flip it to open an interactive path to a host they already control
  through another channel. Sysmon Event ID 13.
references:
  - https://attack.mitre.org/techniques/T1021/001/
author: Tyrian
date: 2026/09/28
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    TargetObject|endswith: '\Control\Terminal Server\fDenyTSConnections'
    Details: 'DWORD (0x00000000)'
  condition: selection
validation:
  atomic: T1021.001
  fire: |-
    reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
falsepositives:
  - Deliberate RDP enablement by admins or GPO; correlate with a change ticket
level: medium
tags:
  - attack.lateral_movement
  - attack.defense_evasion
  - attack.t1021.001
  - attack.t1112
