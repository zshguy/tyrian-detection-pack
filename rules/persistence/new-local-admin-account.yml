title: Account Added to a Privileged Local or Domain Group
id: 4afe3396-b3d6-42c0-9143-tyrian000027
status: stable
description: >
  Detects membership changes to high-value groups. Adding an account to Domain
  Admins or the local Administrators group is both a common attacker objective
  and a rare, auditable administrative act.
references:
  - https://attack.mitre.org/techniques/T1098/
author: Tyrian
date: 2026/07/27
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
      - 4728
      - 4732
      - 4756
  condition: selection
falsepositives:
  - Routine onboarding, which should still be reviewed
level: high
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1098
