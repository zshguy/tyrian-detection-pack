title: AWS AdministratorAccess Policy Attached
id: e0c81495-5d48-4dc3-83e3-tyrian000077
status: experimental
description: >
  Detects the AWS managed AdministratorAccess policy being attached to a user,
  role or group. Granting a foothold identity full admin is a common way to
  make stolen access durable.
references:
  - https://attack.mitre.org/techniques/T1098/003/
author: Tyrian
date: 2026/09/28
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'iam.amazonaws.com'
    eventName:
      - 'AttachUserPolicy'
      - 'AttachRolePolicy'
      - 'AttachGroupPolicy'
    requestParameters.policyArn|endswith: ':policy/AdministratorAccess'
  condition: selection
validation:
  atomic: T1098.003
  fire: |-
    aws iam attach-user-policy --user-name <lab-user> --policy-arn arn:aws:iam::aws:policy/AdministratorAccess
falsepositives:
  - Break-glass provisioning; allowlist your identity team's automation
level: high
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1098.003
