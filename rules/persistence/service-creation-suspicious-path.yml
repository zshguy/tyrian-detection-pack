title: Service Installed From a Suspicious Path
id: 28dc1174-91b4-40ae-7f21-tyrian000025
status: stable
description: >
  Detects a new service whose binary lives in a user-writable directory or is
  launched through an interpreter. Services are a durable, SYSTEM-level foothold
  and legitimate ones almost never run out of temp.
references:
  - https://attack.mitre.org/techniques/T1543/003/
author: Tyrian
date: 2026/07/27
logsource:
  product: windows
  service: system
detection:
  selection:
    EventID: 7045
  suspicious_path:
    ServiceFileName|contains:
      - '\\Temp\\'
      - '\\Users\\Public\\'
      - '\\AppData\\'
      - '\\ProgramData\\'
      - 'powershell'
      - 'cmd.exe /c'
      - 'rundll32'
  condition: selection and suspicious_path
validation:
  atomic: T1543.003
  fire: |-
    sc.exe create TyrianTest binPath= C:\Windows\Temp\p.exe start= auto
falsepositives:
  - Some software installs services from ProgramData; allowlist by publisher
level: high
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1543.003
