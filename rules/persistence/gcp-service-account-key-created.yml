title: GCP Service Account Key Created
id: 887340b6-8fcd-4766-b976-tyrian000087
status: experimental
description: >
  Detects a user-managed key being created for a service account. A
  downloaded key is a long-lived credential that works from anywhere and
  survives the password reset that ends most incidents.
references:
  - https://attack.mitre.org/techniques/T1098/001/
author: Tyrian
date: 2026/10/02
logsource:
  product: gcp
  service: gcp.audit
detection:
  selection:
    gcp.audit.method_name: 'google.iam.admin.v1.CreateServiceAccountKey'
  condition: selection
validation:
  atomic: T1098.001
  fire: |-
    gcloud iam service-accounts keys create /tmp/k.json --iam-account=<lab-sa>@<project>.iam.gserviceaccount.com
falsepositives:
  - CI pipelines that mint keys on deploy; allowlist by principalEmail
level: medium
tags:
  - attack.persistence
  - attack.t1098.001
