title: Entra ID Credentials Added to an Application or Service Principal
id: f2e9548c-9a95-4617-a3b2-tyrian000082
status: experimental
description: >
  Detects a client secret or certificate being added to an app registration or
  service principal. A new credential on an already-privileged app gives
  persistent, MFA-free API access to the tenant.
references:
  - https://attack.mitre.org/techniques/T1098/001/
author: Tyrian
date: 2026/09/28
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    OperationName|contains:
      - 'Add service principal credentials'
      - 'Certificates and secrets management'
  condition: selection
validation:
  atomic: T1098.001
  fire: |-
    az ad app credential reset --id <lab-app-id> --append
falsepositives:
  - Scheduled secret rotation; allowlist the rotating identity
level: medium
tags:
  - attack.persistence
  - attack.t1098.001
