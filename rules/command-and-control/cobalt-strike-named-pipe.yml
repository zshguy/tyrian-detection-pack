title: Cobalt Strike Default Named Pipe
id: f394c5a2-16b3-47e6-c2da-tyrian000061
status: experimental
description: >
  Detects named pipes matching Cobalt Strike's default naming for SMB beacons and
  post-exploitation jobs (msagent_, postex_, status_, and the MSSE- pattern).
  Operators can and do change these in a malleable profile, so this catches
  unmodified tooling rather than a tuned engagement. It stays worth having because
  unmodified tooling is what commodity intrusions actually run.
references:
  - https://attack.mitre.org/techniques/T1055/
  - https://attack.mitre.org/techniques/T1071/
author: Tyrian
date: 2026/08/03
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID:
      - 17   # pipe created
      - 18   # pipe connected
    PipeName|startswith:
      - '\msagent_'
      - '\postex_'
      - '\postex_ssh_'
      - '\status_'
      - '\MSSE-'
      - '\mojo_'
      - '\netsvc_'
  condition: selection
validation:
  atomic: T1055
  fire: |-
    Run a Cobalt Strike beacon with a default malleable profile and start an SMB
    beacon or a post-exploitation job (for example `run whoami`), which creates a
    postex_ pipe. On a range, any process creating a pipe named \msagent_test
    reproduces the telemetry.
falsepositives:
  - Chromium-based browsers create \mojo_ pipes constantly; drop that value unless
    you have baselined it
level: high
tags:
  - attack.command_and_control
  - attack.defense_evasion
  - attack.t1055
  - attack.t1071
