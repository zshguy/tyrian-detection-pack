title: Logon With New Credentials (Logon Type 9)
id: 5f768d6d-73f5-440a-8231-tyrian000072
status: experimental
description: >
  Detects a type 9 NewCredentials logon through seclogo, which is what
  runas /netonly produces and what Mimikatz sekurlsa::pth and similar
  token-making tools produce when they spawn a process with injected
  credentials. Event ID 4624.
references:
  - https://attack.mitre.org/techniques/T1134/001/
  - https://attack.mitre.org/techniques/T1550/002/
author: Tyrian
date: 2026/09/28
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 9
    LogonProcessName: 'seclogo'
  condition: selection
validation:
  atomic: T1134.001
  fire: |-
    runas /netonly /user:CONTOSO\test cmd.exe
falsepositives:
  - Administrators using runas /netonly for cross-domain tooling; allowlist by SubjectUserName
level: medium
tags:
  - attack.privilege_escalation
  - attack.defense_evasion
  - attack.t1134.001
  - attack.t1550.002
