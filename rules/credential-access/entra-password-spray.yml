title: Entra ID Password Spray From One IP
id: e3b80f79-f00e-4fc7-9345-tyrian000079
status: experimental
description: >
  Detects one source IP failing sign-in with a wrong password (error 50126)
  against many distinct Entra ID accounts in a short window.
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: Tyrian
date: 2026/09/28
logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    ResultType: '50126'
  timeframe: 10m
  condition: selection | count(UserPrincipalName) by IPAddress >= 10
validation:
  atomic: T1110.003
  fire: |-
    Spray one wrong password across 10+ lab tenant accounts from one IP,
    e.g. with MSOLSpray or Invoke-AzureAdPasswordSprayAttack.
falsepositives:
  - Shared egress IPs (VPN, NAT) with many users mistyping; tune the threshold
level: high
tags:
  - attack.credential_access
  - attack.t1110.003
