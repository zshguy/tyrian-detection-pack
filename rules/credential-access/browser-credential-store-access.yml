title: Browser Credential Store Accessed From the Command Line
id: 9d2f62e5-f031-406b-95e5-tyrian000073
status: experimental
description: >
  Detects a process other than the browser itself naming a browser's saved
  password or cookie store (Chromium Login Data, Cookies, Local State; Firefox
  key4.db, logins.json) on its command line. Infostealers and hands-on
  operators copy these files out before decrypting them offline.
references:
  - https://attack.mitre.org/techniques/T1555/003/
author: Tyrian
date: 2026/09/28
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    CommandLine|contains:
      - '\User Data\Default\Login Data'
      - '\User Data\Default\Network\Cookies'
      - '\User Data\Local State'
      - '\key4.db'
      - '\logins.json'
  filter_browsers:
    Image|endswith:
      - '\chrome.exe'
      - '\msedge.exe'
      - '\firefox.exe'
      - '\brave.exe'
      - '\opera.exe'
  condition: selection and not filter_browsers
validation:
  atomic: T1555.003
  fire: |-
    copy "%LOCALAPPDATA%\Google\Chrome\User Data\Default\Login Data" %TEMP%\ld.db
falsepositives:
  - Browser profile backup and migration tools
level: high
tags:
  - attack.credential_access
  - attack.t1555.003
