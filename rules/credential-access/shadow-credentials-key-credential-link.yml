title: Shadow Credentials Added via msDS-KeyCredentialLink
id: 8c2d5e3b-af4c-407e-b963-tyrian000054
status: experimental
description: >
  Detects a write to the msDS-KeyCredentialLink attribute of a user or computer
  object. Adding a key credential registers an attacker-controlled certificate for
  Kerberos PKINIT, giving them a way to authenticate as that principal and recover
  its NTLM hash without ever changing a password. Almost nothing writes this
  attribute outside Windows Hello for Business enrollment.
references:
  - https://attack.mitre.org/techniques/T1556/
  - https://attack.mitre.org/techniques/T1098/
author: Tyrian
date: 2026/08/03
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5136
    AttributeLDAPDisplayName: 'msDS-KeyCredentialLink'
  condition: selection
validation:
  atomic: T1556
  fire: |-
    Whisker.exe add /target:DC01$
    pywhisker.py -d domain -u user -p pass --target victim --action add
falsepositives:
  - Windows Hello for Business enrollment, which legitimately populates this attribute
  - Azure AD / Entra hybrid join writing key credentials
level: critical
tags:
  - attack.credential_access
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1556
  - attack.t1098
