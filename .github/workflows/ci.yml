name: validate + compile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml

      # The compiler is the part that can be wrong silently: a mistranslation
      # deploys cleanly and simply never fires. Every case in here is one that
      # was wrong at some point.
      - name: Compiler tests
        run: python -m unittest discover -s tools -p "test_*.py" -v

      # Every rule must parse, carry an ATT&CK technique tag, and use only
      # constructs the compiler can translate faithfully.
      - name: Validate rule corpus
        run: python tools/sigma_compile.py --backend validate

      - name: Compile all backends
        run: |
          python tools/sigma_compile.py --backend wazuh     --out dist/wazuh
          python tools/sigma_compile.py --backend splunk    --out dist/splunk
          python tools/sigma_compile.py --backend sentinel  --out dist/sentinel
          python tools/sigma_compile.py --backend navigator --out dist/navigator
          python tools/sigma_compile.py --backend coverage

      # dist/ and COVERAGE.md are committed deliverables so the pack is usable
      # without running anything. CI is the authority for them rather than the
      # contributor's machine, because Windows endpoint AV quarantines compiled
      # detections (they contain the attacker strings they match on).
      # Contributors edit rules/ and never have to produce build output at all.
      #
      # Both are committed in ONE step: staging them separately risks making a
      # COVERAGE.md commit that never gets pushed, because the push lives in the
      # dist/ step and that step short-circuits when dist/ has not drifted.
      - name: Commit refreshed build output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Stage first, then compare against the index. `git diff` alone only
          # reports modifications to already-tracked files, so a compiled rule
          # that is missing entirely (the usual case, since contributors on
          # Windows lose AV-quarantined files) would look like "no drift".
          git add -A dist/ COVERAGE.md
          if git diff --cached --quiet -- dist/ COVERAGE.md; then
            echo "build output already current"
            exit 0
          fi
          echo "build output drifted:"
          git diff --cached --stat -- dist/ COVERAGE.md
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: recompile dist/ and COVERAGE.md from rules/"
          git push

      # On pull requests we only report drift, never push to a fork's branch.
      - name: Report build output drift
        if: github.event_name == 'pull_request'
        run: |
          git add -N -A dist/ COVERAGE.md
          if git diff --quiet -- dist/ COVERAGE.md; then
            echo "build output is current"
          else
            echo "::notice::dist/ or COVERAGE.md differs from rules/. It will be recompiled automatically when this merges."
            git diff --stat -- dist/ COVERAGE.md
          fi

      - name: Coverage summary
        run: |
          python tools/sigma_compile.py --backend stats | tee /tmp/stats.json
          {
            echo '### Detection coverage'
            echo '```json'
            cat /tmp/stats.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The README claims a translation rate against the full SigmaHQ corpus. Claims
  # like that rot quietly: upstream adds rules using constructs this compiler
  # does not implement, and the number in the README stays where it was. So the
  # claim is re-measured on every run against SigmaHQ main, and published to the
  # job summary where anyone can check it.
  sigmahq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml

      - name: Check out SigmaHQ
        uses: actions/checkout@v4
        with:
          repository: SigmaHQ/sigma
          path: .sigmahq
          fetch-depth: 1

      - name: Measure translation coverage
        run: |
          python tools/sigma_compile.py --input .sigmahq/rules --backend report \
            | tee sigmahq-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Compile every backend against SigmaHQ
        run: |
          for backend in wazuh splunk sentinel; do
            python tools/sigma_compile.py --input .sigmahq/rules \
              --backend "$backend" --out ".sigmahq-dist/$backend" \
              --summary ".sigmahq-dist/$backend.json"
          done

      # A rule that compiles is not the same as a rule Wazuh will load. Wazuh
      # parses local_rules.xml with libxml2 and rejects the entire ruleset on one
      # error, so the generated file is parsed here before anybody deploys it.
      - name: Generated Wazuh XML must be well-formed
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          xml = open(".sigmahq-dist/wazuh/local_rules.xml", encoding="utf-8").read()
          ET.fromstring(f"<root>{xml}</root>")
          print(f"parsed {xml.count('<rule id=')} Wazuh rules compiled from SigmaHQ")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sigmahq-translation
          path: |
            sigmahq-report.md
            .sigmahq-dist/
